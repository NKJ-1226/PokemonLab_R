<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title th:text="${pokemon.name} + ' | PokemonLab図鑑'">ポケモン図鑑</title>
    <link rel="stylesheet" th:href="@{/css/pokedex-detail.css}">
    <link rel="stylesheet" th:href="@{/css/pokemon-type.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
</head>
<body>
<main class="device">
    <header class="device-header">
        <div class="status-light"></div>
        <div>
            <!-- <p class="system-label">POKÉMON DATA TERMINAL</p> -->
            <h1>ポケモン図鑑</h1>
        </div>
        <a class="list-button" th:href="@{/pokedex}">一覧へ戻る</a>
    </header>

    <section class="screen">
        <div class="pokemon-summary">
            <!-- ポケモン画像 -->
            <div class="image-panel">
                <img class="pokemon-sprite"
                     th:src="@{/images/pokemon/{id}.png(id=${pokemon.id})}"
                     th:alt="${pokemon.name}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
                <div class="image-fallback">?</div>
            </div>

            <!-- ポケモン基本情報 -->
            <div class="identity-panel">

                <!-- 図鑑No -->
                <p class="dex-number" th:text="'No.' + ${#numbers.formatInteger(pokemon.pokedexNo, 3)}"></p>

                <!-- 名前 -->
                <h2 th:text="${pokemon.name}"></h2>

                <!-- タイプ -->
                <div class="types">
                    <!-- タイプ1 -->
                    <span class="type-badge"
                          th:classappend="' type-' + ${pokemon.type1}"
                          th:text="${pokemon.type1}">
                    </span>
                    
                    <!-- タイプ2 -->
                    <span class="type-badge"
                          th:if="${pokemon.type2 != null and !pokemon.type2.isBlank()}"
                          th:classappend="' type-' + ${pokemon.type2}"
                          th:text="${pokemon.type2}">
                    </span>
                </div>

                <!-- 世代 -->
                <p>第<span th:text="${pokemon.generation}"></span>世代</p>

                <div class="pokemon-profile">

                    <!-- ぶんるい -->
                    <div class="profile-row">
                        <span class="profile-label">ぶんるい</span>
                        <strong th:text="${pokemon.category}">ねずみポケモン</strong>
                    </div>

                    <!-- たかさ -->
                    <div class="profile-row">
                        <span class="profile-label">たかさ</span>
                        <strong>
                            <span th:text="${pokemon.formattedHeight != null ? #numbers.formatDecimal(pokemon.formattedHeight, 1, 1) : '---'}"></span>
                            <span th:if="${pokemon.formattedHeight != null}">m</span>
                        </strong>
                    </div>

                    <!-- おもさ -->
                    <div class="profile-row">
                        <span class="profile-label">おもさ</span>
                        <strong>
                            <span th:text="${pokemon.formattedWeight != null ? #numbers.formatDecimal(pokemon.formattedWeight, 1, 1) : '---'}"></span>
                            <span th:if="${pokemon.formattedWeight != null}">kg</span>
                        </strong>
                    </div>

                </div>
            </div>
        </div>

        <!-- 種族値 -->
        <section class="stats-panel">
            <div class="stats-title">
                <h3>種族値</h3>
                <strong th:text="'TOTAL ' + ${pokemon.total}"></strong>
            </div>
            <div class="stat-row"><span>HP</span><div class="stat-track"><div class="stat-fill" th:style="'width:' + ${pokemon.hp * 100 / 255} + '%'"></div></div><strong th:text="${pokemon.hp}"></strong></div>
            <div class="stat-row"><span>こうげき</span><div class="stat-track"><div class="stat-fill" th:style="'width:' + ${pokemon.attack * 100 / 255} + '%'"></div></div><strong th:text="${pokemon.attack}"></strong></div>
            <div class="stat-row"><span>ぼうぎょ</span><div class="stat-track"><div class="stat-fill" th:style="'width:' + ${pokemon.defense * 100 / 255} + '%'"></div></div><strong th:text="${pokemon.defense}"></strong></div>
            <div class="stat-row"><span>とくこう</span><div class="stat-track"><div class="stat-fill" th:style="'width:' + ${pokemon.spAttack * 100 / 255} + '%'"></div></div><strong th:text="${pokemon.spAttack}"></strong></div>
            <div class="stat-row"><span>とくぼう</span><div class="stat-track"><div class="stat-fill" th:style="'width:' + ${pokemon.spDefense * 100 / 255} + '%'"></div></div><strong th:text="${pokemon.spDefense}"></strong></div>
            <div class="stat-row"><span>すばやさ</span><div class="stat-track"><div class="stat-fill" th:style="'width:' + ${pokemon.speed * 100 / 255} + '%'"></div></div><strong th:text="${pokemon.speed}"></strong></div>
        </section>

        <!-- 進化ライン -->
        <section class="evolution-panel">
            <div class="evolution-title">
                <h3>進化ライン</h3>
            </div>

            <!-- 進化関係が存在している場合のみ表示 -->
            <div class="evolution-content"
                 th:if="${evolutionStages != null and !#lists.isEmpty(evolutionStages)}">

                <!-- 進化段階ごとに表示 -->
                <div class="evolution-group"
                     th:each="stage, stageStat : ${evolutionStages}">

                    <!-- 進化方向 -->
                    <div class="evolution-arrow"
                         th:if="${!stageStat.first}"
                         aria-hidden="true">▼</div>

                    <!-- 進化ライン一覧 -->
                    <div class="evolution-cards">

                        <th:block th:each="evolutionPokemon : ${stage}">

                            <!-- 現在のポケモン -->
                            <div class="evolution-card current"
                                 th:if="${evolutionPokemon.id == pokemon.id}">
                                <img th:src="@{/images/pokemon/{id}.png(id=${evolutionPokemon.id})}"
                                     th:alt="${evolutionPokemon.name}"
                                     onerror="this.style.display='none';">
                                <strong th:text="${evolutionPokemon.name}"></strong>
                            </div>

                            <!-- 進化前・進化先のポケモン -->
                            <a class="evolution-card"
                               th:unless="${evolutionPokemon.id == pokemon.id}"
                               th:href="@{/pokedex/{id}(id=${evolutionPokemon.id})}">
                                <img th:src="@{/images/pokemon/{id}.png(id=${evolutionPokemon.id})}"
                                     th:alt="${evolutionPokemon.name}"
                                     onerror="this.style.display='none';">
                                <strong th:text="${evolutionPokemon.name}"></strong>
                            </a>

                        </th:block>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <!-- 図鑑ID順の前後移動 -->
    <nav class="navigation">
        <a class="nav-button" th:if="${previousPokemon != null}"
           th:href="@{/pokedex/{id}(id=${previousPokemon.id})}">
            <span>◀ PREV</span><strong th:text="${previousPokemon.name}"></strong>
        </a>
        <div class="nav-button disabled" th:unless="${previousPokemon != null}">
            <span>◀ PREV</span><strong>なし</strong>
        </div>
        <a class="nav-button" th:if="${nextPokemon != null}"
           th:href="@{/pokedex/{id}(id=${nextPokemon.id})}">
            <span>NEXT ▶</span><strong th:text="${nextPokemon.name}"></strong>
        </a>
        <div class="nav-button disabled" th:unless="${nextPokemon != null}">
            <span>NEXT ▶</span><strong>なし</strong>
        </div>
    </nav>
</main>
</body>
</html>
