<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title>回答結果 | PokemonLab</title>

    <link rel="stylesheet"
          th:href="@{/css/quiz.css}">
</head>

<body>

<main class="quiz-device answer-device">

    <header class="quiz-header answer-header">

        <div class="quiz-light"></div>

        <div>
            <p>BASE STATUS QUIZ SYSTEM</p>
            <h1>回答結果</h1>
        </div>

        <div class="question-counter">
            <span th:text="${questionNumber}"></span>
            /
            <span th:text="${totalQuestion}"></span>
        </div>

    </header>

    <section class="answer-screen">

        <div class="answer-main">

            <!-- 正解ポケモンの画像だけ表示 -->
            <div class="answer-pokemon-area">

                <img
                    class="answer-pokemon-image"
                    th:src="@{/images/pokemon/{id}.png(id=${correctPokemon.id})}"
                    th:alt="${correctPokemon.name}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='grid';
                    ">

                <div class="answer-image-fallback">
                    ?
                </div>

            </div>

            <div class="answer-data">

                <section class="correct-pokemon-box">

                    <div class="correct-label">
                        正解：
                    </div>

                    <div class="correct-pokemon-name"
                         th:text="${correctPokemon.name}">
                    </div>

                </section>

                <section class="selected-answer-box">

                    あなたの回答：

                    <strong th:text="${selectedPokemon.name}">
                    </strong>

                </section>

            </div>

        </div>

        <!-- 正誤メッセージ -->
        <section
            class="answer-message"
            th:classappend="${correct} ? ' message-correct' : ' message-wrong'">

            <span th:if="${correct}">
                あたり　です！
            </span>

            <span th:unless="${correct}">
                ばか　はずれです……
            </span>

        </section>

    </section>

    <footer class="answer-footer">

        <div class="answer-score">

            <span>SCORE</span>

            <strong th:text="${score}">
            </strong>

            <span>/</span>

            <span th:text="${totalQuestion}">
            </span>

        </div>

        <form
            class="next-form"
            th:action="@{/quiz/next}"
            method="post">

            <button
                class="next-button"
                type="submit">

                つぎへすすむ ▶

            </button>

        </form>

    </footer>

</main>

</body>
</html>
